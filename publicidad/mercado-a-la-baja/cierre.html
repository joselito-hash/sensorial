<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mercado a la baja · cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;600;800&display=block" rel="stylesheet">
<style>
  /* Historia de cierre 1080×1920: cartel tipográfico, sin frascos.
     La escalera cruza la pantalla y termina en el botón para escribir. */
  :root {
    --papel: #120e10;
    --tinta: #f4eef1;
    --tinta-2: #b9adb3;
    --rojo: #e0303f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--papel); }

  .anuncio {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--papel);
    color: var(--tinta);
    font-family: "Urbanist", sans-serif;
  }

  .logo {
    position: absolute; top: 92px; left: 50%;
    height: 196px; transform: translateX(-50%);
  }

  h1 {
    position: absolute; top: 410px; left: 68px;
    font-weight: 800; font-size: 172px; line-height: 0.92; letter-spacing: -0.045em;
  }

  .escalera { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .texto { position: absolute; left: 72px; top: 1356px; width: 540px; }
  .texto strong { display: block; font-weight: 600; font-size: 54px; line-height: 1.1; }
  .texto span { display: block; margin-top: 18px; font-weight: 300; font-size: 42px; line-height: 1.2; color: var(--tinta-2); }

  .boton {
    position: absolute; left: 632px; top: 1590px;
    width: 384px; height: 112px;
    display: grid; place-items: center;
    background: var(--rojo);
    font-weight: 800; font-size: 40px; letter-spacing: -0.01em;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="anuncio">
  <img class="logo" src="sensorial-logo.svg" alt="Sensorial Boutique">

  <h1>¿No viste<br>el tuyo?</h1>

  <!-- Cinco escalones que bajan de izquierda a derecha hasta el botón -->
  <svg class="escalera" viewBox="0 0 1080 1920" aria-hidden="true">
    <polyline points="72,850 222,850 222,970 372,970 372,1090 522,1090 522,1210 672,1210 672,1330 824,1330 824,1470"
      fill="none" stroke="#e0303f" stroke-width="40" stroke-linejoin="miter"/>
    <path d="M760 1464 H888 L824 1564 Z" fill="#e0303f"/>
  </svg>

  <p class="texto">
    <strong>Tenemos más perfumes en rebaja.</strong>
    <span>Escríbenos y te decimos precio y disponibilidad.</span>
  </p>

  <div class="boton">Mándanos mensaje</div>
</div>
</body>
</html>
