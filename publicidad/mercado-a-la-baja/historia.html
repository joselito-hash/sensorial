<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mercado a la baja · historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Urbanist:ital,wght@0,300..800;1,300..800&display=block" rel="stylesheet">
<style>
  /* Plantilla 1080×1920 (pantalla de celular / historia), un perfume por imagen.
     Elige el perfume con ?p=ysl | valentino | scandal. Mismos tokens que styles.css. */
  :root {
    --papel: #221c20;
    --papel-2: #332a30;
    --tinta: #f7f2f4;
    --tinta-2: #cbbfc6;
    --linea: rgb(255 255 255 / 0.10);
    --rojo: #ff3347;
    --rojo-hondo: #c8102e;
    --r-marco: 1.5rem;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--papel); }

  .anuncio {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(60% 35% at 85% 10%, rgb(255 51 71 / 0.18), transparent 70%),
      radial-gradient(70% 35% at 10% 100%, rgb(255 51 71 / 0.12), transparent 70%),
      var(--papel);
    color: var(--tinta);
    font-family: "Urbanist", sans-serif;
  }

  .rejilla {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--linea) 1px, transparent 1px),
      linear-gradient(90deg, var(--linea) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: linear-gradient(180deg, #000 0%, #000 40%, transparent 62%);
  }

  .grafica { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .cabecera {
    position: absolute; top: 130px; left: 64px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cabecera img { height: 66px; }
  .bolsa {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 13px 24px 13px 18px;
    border-radius: 999px;
    background: rgb(255 51 71 / 0.14);
    border: 1.5px solid rgb(255 51 71 / 0.55);
    color: #ff8a96;
    font-weight: 700; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .bolsa::before {
    content: ""; width: 12px; height: 12px; border-radius: 50%;
    background: var(--rojo); box-shadow: 0 0 0 6px rgb(255 51 71 / 0.25);
  }

  .titular { position: absolute; top: 410px; left: 64px; width: 660px; }
  .titular .antetitulo {
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: 70px; line-height: 1.02; color: var(--tinta-2);
  }
  .titular h1 {
    margin-top: 16px;
    font-weight: 800; font-size: 110px; line-height: 0.92; letter-spacing: -0.035em;
  }
  .titular h1 em {
    font-style: normal; color: var(--rojo);
    text-shadow: 0 0 40px rgb(255 51 71 / 0.45);
  }

  .flechota {
    position: absolute; right: 50px; top: 330px;
    width: 300px; height: 520px;
    filter: drop-shadow(0 0 40px rgb(255 51 71 / 0.6));
  }

  .producto {
    position: absolute; left: 56px; right: 56px; top: 880px;
    background: var(--papel-2);
    border-radius: 2rem;
    padding: 16px 16px 30px;
    border: 1px solid rgb(255 255 255 / 0.08);
    box-shadow: 0 40px 80px -36px rgb(0 0 0 / 0.75);
  }
  .producto .foto {
    height: 520px;
    border-radius: var(--r-marco);
    background: #f4eef1;
    position: relative;
    overflow: hidden;
  }
  /* Las fotos traen fondo blanco: multiply lo funde con el marco */
  .producto .foto img {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    height: calc(var(--alto, 0.92) * 100%);
    width: auto; max-width: none;
    mix-blend-mode: multiply;
  }

  .producto .datos {
    margin: 28px 14px 0;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  .producto .marca {
    font-size: 21px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tinta-2);
  }
  .producto .nombre {
    margin-top: 6px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: 66px; line-height: 1;
  }
  .producto .precio { display: flex; align-items: center; gap: 14px; }
  .producto .precio svg { width: 58px; height: 70px; flex: none; filter: drop-shadow(0 0 16px rgb(255 51 71 / 0.65)); }
  .producto .precio span {
    font-weight: 800; font-size: 104px; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }

  .cinta {
    position: absolute; left: 0; right: 0; top: 1600px;
    height: 80px;
    background: var(--rojo-hondo);
    display: flex; align-items: center; gap: 40px;
    white-space: nowrap;
    transform: rotate(-2.2deg) scale(1.05);
    box-shadow: 0 20px 50px -20px rgb(200 16 46 / 0.8);
    font-weight: 800; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase;
    padding-left: 24px;
  }
  .cinta b { color: #ffd2d7; font-weight: 800; }

  .pie {
    position: absolute; left: 64px; right: 64px; top: 1745px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 26px; color: var(--tinta-2);
  }
  .pie strong { color: var(--tinta); font-weight: 700; }
  .pie .marca-pie { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 32px; color: var(--tinta); }
</style>
</head>
<body>
<div class="anuncio">
  <div class="rejilla"></div>

  <svg class="grafica" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="relleno" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff3347" stop-opacity="0.28"/>
        <stop offset="0.5" stop-color="#ff3347" stop-opacity="0"/>
      </linearGradient>
      <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="M-10 250 L100 238 L170 278 L250 260 L330 304 L410 285 L490 326 L570 308 L650 348 L730 330 L810 382 L810 1920 L-10 1920 Z" fill="url(#relleno)" opacity="0.35"/>
    <polyline points="-10,250 100,238 170,278 250,260 330,304 410,285 490,326 570,308 650,348 730,330 810,382"
      fill="none" stroke="#ff3347" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" filter="url(#brillo)" opacity="0.9"/>
  </svg>

  <header class="cabecera">
    <img src="sensorial-logo.svg" alt="Sensorial Boutique">
    <span class="bolsa">Mercado en caída</span>
  </header>

  <section class="titular">
    <p class="antetitulo">El mercado va a la baja…</p>
    <h1>y nuestros precios <em>también.</em></h1>
  </section>

  <svg class="flechota" viewBox="0 0 300 520" aria-hidden="true">
    <defs>
      <linearGradient id="flecha" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6b78"/>
        <stop offset="1" stop-color="#e0112b"/>
      </linearGradient>
    </defs>
    <path d="M105 0 H195 Q205 0 205 10 V350 H284 Q300 350 289 362 L162 512 Q150 524 138 512 L11 362 Q0 350 16 350 H95 V10 Q95 0 105 0 Z" fill="url(#flecha)"/>
  </svg>

  <article class="producto">
    <div class="foto"><img id="foto" src="" alt=""></div>
    <div class="datos">
      <div>
        <p class="marca" id="marca"></p>
        <p class="nombre" id="nombre"></p>
      </div>
      <p class="precio">
        <svg viewBox="0 0 40 48"><path d="M14 2h12v22h12L20 46 2 24h12z" fill="#ff3347"/></svg>
        <span id="precio"></span>
      </p>
    </div>
  </article>

  <div class="cinta" id="cinta"></div>

  <footer class="pie">
    <span class="marca-pie">Sensorial Boutique</span>
    <span>Pídelo por WhatsApp <strong>56 5056 9410</strong></span>
  </footer>
</div>

<script>
  const PERFUMES = {
    ysl:       { marca: "Yves Saint Laurent", nombre: "Libre",        corto: "YSL Libre", precio: "$2,790", foto: "ysl-libre.webp",              alto: 0.94 },
    valentino: { marca: "Valentino",          nombre: "Born in Roma", corto: "Valentino", precio: "$3,000", foto: "valentino-born-in-roma.webp", alto: 1.18 },
    scandal:   { marca: "Jean Paul Gaultier", nombre: "Scandal",      corto: "Scandal",   precio: "$2,500", foto: "scandal.jpg",                 alto: 0.94 },
  };
  const p = PERFUMES[new URLSearchParams(location.search).get("p")] || PERFUMES.ysl;
  const foto = document.getElementById("foto");
  foto.src = p.foto;
  foto.alt = `${p.marca} ${p.nombre}`;
  foto.style.setProperty("--alto", p.alto);
  document.getElementById("marca").textContent = p.marca;
  document.getElementById("nombre").textContent = p.nombre;
  document.getElementById("precio").textContent = p.precio;
  const tramo = `<span>▼ ${p.corto} <b>${p.precio}</b></span><span>▼ Precio a la baja</span>`;
  document.getElementById("cinta").innerHTML = tramo.repeat(3);
</script>
</body>
</html>
