<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mercado a la baja · historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Urbanist:wght@300;600;800&display=block" rel="stylesheet">
<style>
  /* Plantilla 1080×1920 (pantalla de celular / historia), un perfume por imagen.
     Elige el perfume con ?p=ysl | valentino | scandal.
     Urbanist y Cormorant son las fuentes de la tienda; un solo acento rojo, sin brillos. */
  :root {
    --papel: #120e10;
    --piso: #1d171a;
    --tinta: #f4eef1;
    --tinta-2: #b9adb3;
    --rojo: #e0303f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--papel); }

  .anuncio {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    /* Fondo de estudio: pared oscura y un piso apenas más claro donde se para el frasco */
    background: linear-gradient(180deg, var(--papel) 0, var(--papel) 1560px, var(--piso) 1640px, var(--papel) 1920px);
    color: var(--tinta);
    font-family: "Urbanist", sans-serif;
  }

  .logo {
    position: absolute; top: 92px; left: 50%;
    height: 196px; transform: translateX(-50%);
  }

  .titular { position: absolute; top: 380px; left: 72px; right: 72px; }
  .titular p { font-weight: 300; font-size: 60px; line-height: 1.1; color: var(--tinta-2); }
  .titular h1 {
    margin-top: 14px;
    font-weight: 800; font-size: 112px; line-height: 0.95; letter-spacing: -0.035em;
  }
  .titular h1 em { font-style: normal; color: var(--rojo); }

  .escalera { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* Frasco de pie sobre el piso, con su reflejo */
  .frasco {
    position: absolute; right: 60px; bottom: 330px;
    width: 560px; height: 940px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .frasco img { position: relative; height: calc(var(--alto, 1) * 100%); width: auto; max-width: 100%; object-fit: contain; object-position: bottom; }
  .frasco img.reflejo {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%) scaleY(-1);
    opacity: 0.16;
    -webkit-mask-image: linear-gradient(0deg, #000 0%, transparent 28%);
            mask-image: linear-gradient(0deg, #000 0%, transparent 28%);
  }
  .frasco::after {
    content: ""; position: absolute; left: 50%; bottom: -10px;
    width: 76%; height: 26px; transform: translateX(-50%);
    border-radius: 50%;
    background: rgb(0 0 0 / 0.6);
    filter: blur(14px);
  }

  .datos { position: absolute; left: 72px; width: 440px; top: 1255px; }
  .marca { font-weight: 600; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tinta-2); }
  .nombre {
    margin-top: 10px; padding-bottom: 6px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: 70px; line-height: 1.04; white-space: pre-line;
  }
  .precio {
    margin-top: 18px;
    font-weight: 800; font-size: 120px; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div class="anuncio">
  <img class="logo" src="sensorial-logo.svg" alt="Sensorial Boutique">

  <section class="titular">
    <p>El mercado va a la baja.</p>
    <h1>Nuestros precios <em>también.</em></h1>
  </section>

  <!-- La escalera baja desde el titular hasta el precio -->
  <svg class="escalera" viewBox="0 0 1080 1920" aria-hidden="true">
    <polyline points="72,742 172,742 172,842 272,842 272,942 372,942 372,1052"
      fill="none" stroke="#e0303f" stroke-width="40" stroke-linejoin="miter"/>
    <path d="M308 1046 H436 L372 1146 Z" fill="#e0303f"/>
  </svg>

  <div class="frasco">
    <img id="foto" src="" alt="">
    <img class="reflejo" id="reflejo" src="" alt="">
  </div>

  <section class="datos">
    <p class="marca" id="marca"></p>
    <p class="nombre" id="nombre"></p>
    <p class="precio" id="precio"></p>
  </section>
</div>

<script>
  const PERFUMES = {
    ysl:       { marca: "Yves Saint Laurent", nombre: "Libre\nBerry Crush", precio: "$2,790", foto: "ysl-libre-berry-crush.png",        alto: 1 },
    valentino: { marca: "Valentino",          nombre: "Donna\nBorn in Roma", precio: "$2,990", foto: "valentino-donna-born-in-roma.png", alto: 0.84 },
    scandal:   { marca: "Jean Paul Gaultier", nombre: "Scandal\nLe Parfum", precio: "$2,500", foto: "jpg-scandal-le-parfum.png",        alto: 0.98 },
  };
  const p = PERFUMES[new URLSearchParams(location.search).get("p")] || PERFUMES.ysl;
  for (const id of ["foto", "reflejo"]) {
    const img = document.getElementById(id);
    img.src = p.foto;
    img.style.setProperty("--alto", p.alto);
  }
  document.getElementById("foto").alt = `${p.marca} ${p.nombre.replace("\n", " ")}`;
  document.getElementById("marca").textContent = p.marca;
  document.getElementById("nombre").textContent = p.nombre;
  document.getElementById("precio").textContent = p.precio;
</script>
</body>
</html>
